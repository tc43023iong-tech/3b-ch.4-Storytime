
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crayon English Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Patrick Hand', 'Gaegu', cursive;
      overflow-x: hidden;
      background-color: #fffdfa;
      background-image: 
        linear-gradient(90deg, rgba(230,230,230,.5) 1px, transparent 1px),
        linear-gradient(rgba(230,230,230,.5) 1px, transparent 1px);
      background-size: 30px 30px;
    }
    
    .crayon-border {
      border: 3px solid #5d4037;
      border-radius: 255px 25px 225px 25px / 25px 225px 25px 255px;
    }

    .crayon-shadow {
      box-shadow: 6px 6px 0px #e0e0e0;
    }

    .hand-drawn-btn {
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 3px solid #5d4037;
      border-radius: 20px 50px 25px 40px / 40px 25px 50px 20px;
    }

    .hand-drawn-btn:hover {
      transform: scale(1.03) rotate(-1deg);
      box-shadow: 4px 4px 0px rgba(93, 64, 55, 0.2);
    }

    .hand-drawn-btn:active {
      transform: scale(0.96);
      box-shadow: none;
    }

    .crayon-text {
      color: #5d4037;
    }

    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(1deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    .floating {
      animation: float 4s ease-in-out infinite;
    }

    /* Firework Effects */
    @keyframes firework {
      0% { transform: translate(-50%, 60vh); width: 0.5vmin; opacity: 1; }
      50% { width: 0.5vmin; opacity: 1; }
      100% { width: 45vmin; opacity: 0; }
    }

    .firework,
    .firework::before,
    .firework::after
    {
      --initialSize: 0.5vmin;
      --finalSize: 45vmin;
      --particleSize: 0.2vmin;
      --color1: yellow;
      --color2: khaki;
      --color3: white;
      --color4: lime;
      --color5: gold;
      --color6: mediumseagreen;
      --y: -30vmin;
      --x: -50%;
      --shadow: 
        0 0 0 white,
        var(--particleSize) var(--y) var(--color1),
        -20vmin var(--y) var(--color2),
        20vmin var(--y) var(--color3),
        -10vmin -20vmin var(--color4),
        10vmin -20vmin var(--color5),
        -30vmin -10vmin var(--color6),
        30vmin -10vmin var(--color1),
        -25vmin -25vmin var(--color2),
        25vmin -25vmin var(--color3),
        -15vmin -35vmin var(--color4),
        15vmin -35vmin var(--color5),
        -5vmin -40vmin var(--color6),
        5vmin -40vmin var(--color1);
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, var(--y));
      width: var(--initialSize);
      aspect-ratio: 1;
      background: radial-gradient(circle, var(--color1) var(--particleSize), #0000 0) 50% 0%, radial-gradient(circle, var(--color2) var(--particleSize), #0000 0) 100% 50%, radial-gradient(circle, var(--color3) var(--particleSize), #0000 0) 50% 100%, radial-gradient(circle, var(--color4) var(--particleSize), #0000 0) 0% 50%, radial-gradient(circle, var(--color5) var(--particleSize), #0000 0) 80% 90%, radial-gradient(circle, var(--color6) var(--particleSize), #0000 0) 95% 90%, radial-gradient(circle, var(--color1) var(--particleSize), #0000 0) 90% 70%, radial-gradient(circle, var(--color2) var(--particleSize), #0000 0) 100% 60%, radial-gradient(circle, var(--color3) var(--particleSize), #0000 0) 55% 80%, radial-gradient(circle, var(--color4) var(--particleSize), #0000 0) 70% 77%, radial-gradient(circle, var(--color5) var(--particleSize), #0000 0) 22% 67%, radial-gradient(circle, var(--color6) var(--particleSize), #0000 0) 45% 45%, radial-gradient(circle, var(--color1) var(--particleSize), #0000 0) 33% 33%, radial-gradient(circle, var(--color2) var(--particleSize), #0000 0) 10% 10%, radial-gradient(circle, var(--color3) var(--particleSize), #0000 0) 31% 23%;
      background-size: var(--initialSize) var(--initialSize);
      background-repeat: no-repeat;
    }

    .firework::before {
      --x: -50%;
      --y: -50%;
      --initialSize: 0.5vmin;
      --finalSize: 40vmin;
      transform: translate(-50%, -50%) rotate(40deg) scale(1.3) rotateY(40deg);
    }

    .firework::after {
      --x: -50%;
      --y: -50%;
      --initialSize: 0.5vmin;
      --finalSize: 35vmin;
      transform: translate(-50%, -50%) rotate(-40deg) scale(0.9) rotateY(-40deg);
    }

    .firework-animate {
      animation: firework 1.5s infinite;
    }

    .custom-scroll::-webkit-scrollbar {
      width: 10px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background-color: #e0e0e0;
      border-radius: 20px;
      border: 3px solid #fffdfa;
    }

    .scribble-bg {
      background: radial-gradient(circle at center, transparent 0, transparent 100%), 
                  repeating-linear-gradient(45deg, rgba(0,0,0,0.02) 0, rgba(0,0,0,0.02) 1px, transparent 1px, transparent 10px);
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
